<!DOCTYPE html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Baromètre des entreprises du secteur du bâtiment et des travaux publics</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:#f1f4f8;color:#1d2733;padding-bottom:84px}header{background:#0B3A8E;border-bottom:4px solid #F0900F;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;font-weight:600;line-height:1.25}.logo{width:56px;height:56px;background:#fff;border-radius:10px;padding:3px;object-fit:contain;flex:none}#bar{height:6px;background:#d3dbe6}#fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#1E9A3C,#F0900F);transition:width .3s}main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:22px;color:#0B3A8E;margin:.2em 0}h2{font-size:19px;color:#0B3A8E;margin:.3em 0}.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}.card h3{font-size:16px;margin:0 0 4px;color:#0B3A8E}.h{font-size:13px;color:#5b6775;margin:0 0 8px}.note{background:#eaf3ff;border-left:4px solid #0B3A8E;padding:8px 12px;border-radius:6px;font-size:14px;margin:0 0 8px}.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid #cdd6e2;border-radius:8px;margin:6px 0;cursor:pointer}.opt:has(input:checked){border-color:#1E9A3C;background:#e8f5ec}.opt input{width:22px;height:22px;flex:none;accent-color:#1E9A3C}input[type=text],input[type=number],textarea{width:100%;font:inherit;padding:10px;border:1px solid #cdd6e2;border-radius:8px;margin-top:6px}input:focus,textarea:focus{outline:2px solid #F0900F;border-color:#F0900F}textarea{min-height:110px}.err{color:#b3261e;font-size:14px;margin-top:4px}.hide{display:none!important}#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #F0900F;padding:10px;display:flex;gap:10px;justify-content:center}button{font:inherit;font-weight:600;min-height:48px;padding:0 22px;border-radius:8px;border:0;cursor:pointer;background:#0B3A8E;color:#fff;flex:1;max-width:260px}button.go{background:#1E9A3C}button.sec{background:#e3e9f2;color:#0B3A8E}button:disabled{opacity:.6}#hp{position:absolute;left:-9999px}
</style></head><body><header><img class='logo' src='Logo_FRBTP.jpeg' alt='FRBTP Guyane'><div>Baromètre des entreprises du secteur du bâtiment et des travaux publics</div></header><div id='bar'><i id='fill'></i></div><main id='app'></main><nav id='nav'></nav><input id='hp' tabindex='-1' autocomplete='off'><script>
const ENDPOINT_URL='https://script.google.com/macros/s/AKfycbymQEsBOTqENdaOF6wrt-cAnQGkPwkiZfKWtFH3gNEOjmysIeAPCQHCa8NAFTxRuipZ/exec';const SK='btp26';const DQ=String.fromCharCode(34);
const K=['q1_activites','q1_autre','q2_effectif','q3_perspectives','q4_difficultes','q4_autre','q5_carnet','q6_part_publique','q6_part_privee','q6_statut','q7_sous_utilisation','q8_reports','q8_volume','q9_effectifs','q9_nombre','q10_tresorerie','q11_activite_partielle','q12_cessation','q13_mesures','q14_autre','q15_compteurs','q15_consequences','q15_autre','q15_precisions','q16_hausse','q16_ampleur','q16_justification','q16_autre','q17_financement','q17_difficultes','q17_autre'];
const ACT=['Terrassement','Voirie et réseaux divers (VRD)','Génie civil','Canalisations','Routes et voirie','Travaux électriques et réseaux','Couverture et charpente','Bâtiment – gros œuvre','Bâtiment – second œuvre','Bureau d’étude','Autre activité'];
const DIF=['Insuffisance de commandes','Manque de visibilité sur les chantiers à venir','Difficultés de trésorerie','Retards de paiement','Hausse des coûts : matériaux, fournitures, carburant ou énergie','Difficultés de recrutement','Difficulté à maintenir les équipes en activité','Concurrence ou pression sur les prix','Aucune difficulté particulière','Autre difficulté'];
const CAR=['Aucun carnet de commandes','Moins d’un mois','De 1 mois à moins de 3 mois','De 3 mois à moins de 6 mois','De 6 mois à moins de 9 mois','De 9 mois à moins de 12 mois','12 mois ou plus','Difficile à estimer'];
const T=['Votre entreprise','Perspectives et difficultés','Activité et chantiers','Emploi et trésorerie','Avenir de l’entreprise','Votre avis'];
const S=[[{k:'q1_activites',t:'m',r:1,l:'Quelles sont les principales activités de votre entreprise ?',h:'Plusieurs réponses possibles.',o:ACT,oth:{'Autre activité':'q1_autre'}},{k:'q2_effectif',t:'s',r:1,l:'Quel est l’effectif salarié actuel de votre entreprise ?',h:'Une seule réponse.',o:['Aucun salarié','1 à 9 salariés','10 à 19 salariés','20 à 49 salariés','50 à 99 salariés','100 salariés et plus']}],
[{k:'q3_perspectives',t:'s',r:1,l:'Comment envisagez-vous les perspectives économiques de votre entreprise pour 2027 ?',h:'Une seule réponse.',o:['Avec optimisme','Avec incertitude','Avec pessimisme']},{k:'q4_difficultes',t:'m',r:1,l:'Quelles sont les principales difficultés rencontrées actuellement par votre entreprise ?',h:'Plusieurs réponses possibles.',o:DIF,x:['Aucune difficulté particulière'],oth:{'Autre difficulté':'q4_autre'}}],
[{k:'q5_carnet',t:'s',r:1,l:'À combien de mois d’activité estimez-vous votre carnet de commandes actuel ?',h:'Une seule réponse.',o:CAR},{k:'q7_sous_utilisation',t:'s',l:'Vos équipes ou votre matériel sont-ils actuellement sous-utilisés faute de chantiers ?',h:'Une seule réponse.',o:['Oui, de manière importante','Oui, de manière ponctuelle','Non','Non concerné ou difficile à estimer']},{k:'q8_reports',t:'s',l:'Avez-vous actuellement des marchés attribués dont le démarrage est reporté ?',h:'Une seule réponse.',o:['Oui','Non','Ne sait pas']},{k:'q8_volume',t:'s',sub:1,d:a=>a.q8_reports==='Oui',l:'Quel volume d’activité ces reports représentent-ils approximativement ?',h:'',o:['Moins d’un mois d’activité','De 1 mois à moins de 3 mois','De 3 mois à moins de 6 mois','6 mois d’activité ou plus','Difficile à estimer']},{k:'q6_part_publique',t:'s',l:'Quelle part de votre carnet de commandes provient de clients publics ?',h:'Une seule réponse.',o:['Moins de 25 %','De 25 % à moins de 50 %','De 50 % à moins de 75 %','75 % et plus']},{k:'q15_compteurs',t:'s',l:'Votre entreprise rencontre-t-elle actuellement des difficultés pour l’ouverture ou la mise en service de compteurs de chantier (électricité EDF, eau SGDE) ?',h:'Une seule réponse.',o:['Oui','Non']},{k:'q15_consequences',t:'m',sub:1,d:a=>a.q15_compteurs==='Oui',l:'Quelles conséquences ces difficultés ont-elles sur votre activité ?',h:'Plusieurs réponses possibles.',o:['Retard de démarrage ou d’avancement de chantier','Surcoût (groupe électrogène, approvisionnement en eau, etc.)','Pénalités de retard ou litige avec le maître d’ouvrage','Arrêt ou suspension de chantier','Autre (à préciser)'],oth:{'Autre (à préciser)':'q15_autre'}},{k:'q15_precisions',t:'x',sub:1,d:a=>a.q15_compteurs==='Oui',l:'Souhaitez-vous préciser les difficultés rencontrées (délais, démarches, interlocuteurs…) ?',h:''}],
[{k:'q9_effectifs',t:'s',l:'Quelle évolution de vos effectifs salariés envisagez-vous pour 2027 ?',h:'Une seule réponse.',o:['Une augmentation des effectifs','Un maintien des effectifs','Une réduction des effectifs','La situation est encore incertaine','Non concerné']},{k:'q9_nombre',t:'s',sub:1,d:a=>a.q9_effectifs==='Une augmentation des effectifs'||a.q9_effectifs==='Une réduction des effectifs',lf:a=>a.q9_effectifs==='Une réduction des effectifs'?'Combien de postes seraient concernés ?':'Combien de salariés supplémentaires prévoyez-vous ?',l:'',h:'',o:['1 à 2','3 à 5','6 à 10','Plus de 10','Ne sait pas encore']},{k:'q10_tresorerie',t:'s',l:'Comment qualifieriez-vous la situation de trésorerie actuelle de votre entreprise ?',h:'Une seule réponse.',o:['Confortable ou satisfaisante','Fragile','Tendue','Ne souhaite pas répondre']},{k:'q17_financement',t:'s',l:'Rencontrez-vous actuellement des difficultés pour obtenir un financement bancaire pour votre entreprise ?',h:'Une seule réponse.',o:['Oui','Non','Non concerné (aucune demande en cours)']},{k:'q17_difficultes',t:'m',sub:1,d:a=>a.q17_financement==='Oui',l:'Quelles difficultés rencontrez-vous auprès de votre banque ?',h:'Plusieurs réponses possibles.',o:['Refus de financement','Conditions d’emprunt défavorables (taux, frais)','Garanties exigées trop importantes','Délais de réponse trop longs','Autre (à préciser)'],oth:{'Autre (à préciser)':'q17_autre'}},{k:'q16_hausse',t:'s',l:'Votre entreprise a-t-elle subi une hausse de ses primes d’assurance au cours des 12 derniers mois ?',h:'Une seule réponse.',o:['Oui','Non','Ne sait pas']},{k:'q16_ampleur',t:'s',sub:1,d:a=>a.q16_hausse==='Oui',l:'Quelle est l’ampleur approximative de cette hausse ?',h:'Une seule réponse.',o:['Moins de 10 %','De 10 % à moins de 25 %','De 25 % à moins de 50 %','50 % et plus','Ne souhaite pas répondre']},{k:'q16_justification',t:'m',sub:1,d:a=>a.q16_hausse==='Oui',l:'Quelle justification votre assureur a-t-il avancée ?',h:'Plusieurs réponses possibles.',o:['Sinistralité du secteur','Risques locaux ou conditions d’exercice en Guyane','Désengagement ou retrait d’assureurs','Aucune explication fournie','Autre (à préciser)'],x:['Aucune explication fournie'],oth:{'Autre (à préciser)':'q16_autre'}},{k:'q11_activite_partielle',t:'m',l:'Votre entreprise a-t-elle recours à l’activité partielle ou envisage-t-elle d’y recourir ?',note:'L’activité partielle (anciennement « chômage partiel ») permet à une entreprise confrontée à des difficultés temporaires de réduire ou de suspendre l’activité de ses salariés, sans rompre leur contrat de travail. L’employeur verse une indemnité aux salariés pour les heures non travaillées et reçoit en contrepartie une allocation de l’État, après autorisation de l’administration.',h:'Plusieurs réponses possibles.',o:['Oui, elle y a recours actuellement','Oui, elle y a eu recours au cours des 12 derniers mois','Elle envisage d’y recourir','Si oui, je suis intéressé(e) par un moment d’information sur l’activité partielle','Non, aucune de ces situations','Ne souhaite pas répondre'],x:['Non, aucune de ces situations','Ne souhaite pas répondre']}],
[{k:'q12_cessation',t:'s',l:'Votre entreprise envisage-t-elle une cessation d’activité ou une liquidation en 2027 ?',h:'Une seule réponse.',o:['Oui','Non','La situation est encore incertaine','Ne souhaite pas répondre']}],
[{k:'q13_mesures',t:'x',l:'Quelles mesures attendez-vous prioritairement des pouvoirs publics et des donneurs d’ordre pour soutenir l’activité des entreprises de travaux publics ?',h:''},{k:'q14_autre',t:'x',l:'Souhaitez-vous partager une autre difficulté, une préoccupation ou une observation ?',h:''}]];
const app=document.getElementById('app'),nav=document.getElementById('nav'),fill=document.getElementById('fill'),hp=document.getElementById('hp');
let a={};try{a=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
let st=a._st||0,sending=false;if(!a.id_reponse)a.id_reponse=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const sv=()=>{a._st=st;try{localStorage.setItem(SK,JSON.stringify(a))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
const ALL={};let num=0;S.forEach(s=>s.forEach(q=>{ALL[q.k]=q;if(!q.sub)q.n=++num}));
function qh(q){let b='';if(q.t==='s'||q.t==='m'){b=q.o.map(o=>{const ty=q.t==='s'?'radio':'checkbox';const ck=q.t==='s'?a[q.k]===o:(a[q.k]||[]).includes(o);const ot=q.oth&&q.oth[o];return `<label class='opt'><input type='${ty}' name='${q.k}' value='${esc(o)}' ${ck?'checked':''}><span>${esc(o)}</span></label>`+(ot?`<input type='text' class='ot' data-o='${ot}' data-q='${q.k}' data-f='${esc(o)}' placeholder='Précisez' value='${esc(a[ot])}'>`:'')}).join('')}
else{b=`<textarea data-k='${q.k}'>${esc(a[q.k])}</textarea>`}
return `<div class='card q' data-k='${q.k}'><h3>${q.n?q.n+'. ':''}<span class='lb'>${esc(q.lf?q.lf(a):q.l)}</span></h3>${q.note?`<div class='note'>${esc(q.note)}</div>`:''}<p class='h'>${q.h||''}${q.r?'':' Facultatif.'}</p>${b}<div class='err'></div></div>`}
function upd(){S.flat().forEach(q=>{const el=app.querySelector(`[data-k='${q.k}']`);if(!el)return;if(q.d){const on=q.d(a);el.classList.toggle('hide',!on);if(!on&&a[q.k]){delete a[q.k];el.querySelectorAll('input').forEach(i=>i.checked=false);el.querySelectorAll('textarea').forEach(i=>i.value='')}}if(q.lf)el.querySelector('.lb').textContent=q.lf(a)});
app.querySelectorAll('.ot').forEach(t=>{const q=ALL[t.dataset.q],v=a[q.k],f=t.dataset.f;const on=Array.isArray(v)?v.includes(f):v===f;t.classList.toggle('hide',!on);if(!on&&a[t.dataset.o]){a[t.dataset.o]='';t.value=''}});sv()}
app.addEventListener('change',e=>{const t=e.target,k=t.name;if(!k)return;const q=ALL[k];if(q.t==='s')a[k]=t.value;else if(q.t==='m'){let v=[...app.querySelectorAll(`input[name='${k}']:checked`)].map(i=>i.value);if(t.checked&&q.x){v=q.x.includes(t.value)?[t.value]:v.filter(z=>!q.x.includes(z))}a[k]=v;app.querySelectorAll(`input[name='${k}']`).forEach(i=>i.checked=v.includes(i.value))}upd()});
app.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('ot'))a[t.dataset.o]=t.value;else if(t.tagName==='TEXTAREA')a[t.dataset.k]=t.value;else return;upd()});
app.addEventListener('click',e=>{if(e.target.dataset.a==='c')csv()});
const W=`<div class='card'><h1>Baromètre des entreprises du secteur du bâtiment et des travaux publics</h1><p>Situation des entreprises en 2026 et perspectives pour 2027</p><p>Enquête destinée aux entreprises adhérentes. Dans un contexte économique marqué par des incertitudes dans le secteur des travaux publics, nous souhaitons recueillir votre appréciation de la situation actuelle de votre entreprise et de ses perspectives pour 2027.</p><p>Cette enquête vise à dresser un état des lieux de la conjoncture en Guyane, à identifier les difficultés rencontrées par les entreprises et à anticiper les évolutions à venir. Les réponses sont anonymes et exploitées de manière agrégée afin d’alimenter les échanges avec les pouvoirs publics et les donneurs d’ordre.</p><p><b>Temps de réponse estimé : 7 à 9 minutes.</b> Vos réponses sont enregistrées au fur et à mesure sur cet appareil.</p></div>`;
function nv(){nav.innerHTML=st===0?`<button class='go' data-a='n'>Commencer</button>`:st>6?'':`<button class='sec' data-a='p'>Précédent</button><button data-a='${st===6?'s':'n'}' id='nb'>${st===6?'Envoyer':'Suivant'}</button>`}
function render(){fill.style.width=(Math.min(st,6)/6*100)+'%';if(st===0)app.innerHTML=W;else if(st<=6)app.innerHTML=`<h2>${T[st-1]}</h2><p class='h'>Étape ${st} sur 6</p>`+S[st-1].map(qh).join('');else app.innerHTML=`<div class='card'><h1>Merci pour votre participation</h1><p>Vos réponses ont bien été enregistrées. Elles seront exploitées de manière agrégée.</p></div>`;nv();if(st<=6)upd();window.scrollTo(0,0)}
function ok(){let first=null;S[st-1].forEach(q=>{const el=app.querySelector(`[data-k='${q.k}']`),er=el.querySelector('.err');let m='';if(q.d&&!q.d(a)){er.textContent='';return}const v=a[q.k];if(q.r&&(!v||!v.length))m='Veuillez répondre à cette question.';er.textContent=m;if(m&&!first)first=el});if(first)first.scrollIntoView({behavior:'smooth',block:'center'});return !first}
function pay(){const p={};K.forEach(k=>p[k]=a[k]==null?'':a[k]);p.q6_part_privee='';p.q6_statut='';p.id_reponse=a.id_reponse;p.website=hp.value;return p}
function csv(){const p=pay();const q=s=>DQ+String(Array.isArray(s)?s.join(' | '):s).split(DQ).join(DQ+DQ)+DQ;const txt=K.map(q).join(';')+String.fromCharCode(10)+K.map(k=>q(p[k])).join(';');const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([String.fromCharCode(65279)+txt],{type:'text/csv'}));l.download='reponses_barometre.csv';l.click()}
function send(){if(sending)return;sending=true;const b=document.getElementById('nb');b.disabled=true;b.textContent='Envoi en cours…';fetch(ENDPOINT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pay()),redirect:'follow'}).then(r=>r.json()).then(j=>{if(['success','duplicate','ignored'].includes(j.status)){try{localStorage.removeItem(SK)}catch(e){}st=7;render()}else throw new Error('x')}).catch(()=>{sending=false;b.disabled=false;b.textContent='Envoyer';if(!document.getElementById('fail'))app.insertAdjacentHTML('beforeend',`<div class='card err' id='fail'>Envoi impossible, réessayez. Vos réponses sont conservées sur cet appareil. <button class='sec' data-a='c'>Télécharger mes réponses (CSV)</button></div>`)})}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.a;if(x==='p'){st--;sv();render()}else if(x==='n'){if(st===0||ok()){st++;sv();render()}}else if(x==='s'){if(ok())send()}});
render();
</script></body></html>
